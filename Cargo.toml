[package]
name = "bookos"
version = "0.2.0"
edition = "2024"
description = "Search and download books from Anna's Archive and Libgen, and send them to a Kindle"
repository = "https://github.com/muricristino/bookos"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
keyring = { version = "3", features = ["apple-native"] }
lettre = "0.11"
md-5 = "0.10"
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12"
tungstenite = "0.27"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
opt-level = 3
