[package]
name = "bookos"
version = "0.1.0"
edition = "2024"
description = "Search and download books from Anna's Archive and Libgen"
repository = "https://github.com/muricristino/bookos"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.27"
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
opt-level = 3
